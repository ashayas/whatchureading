apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whatchureading-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatchureading
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whatchureading
  template:
    metadata:
      labels:
        app: whatchureading
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: app
          image: whatchureading:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: PORT
              value: "8787"
            - name: DATA_DIR
              value: /data
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: whatchureading-auth
                  key: SUPABASE_URL
            - name: SUPABASE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: whatchureading-auth
                  key: SUPABASE_PUBLISHABLE_KEY
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: whatchureading-data
---
apiVersion: v1
kind: Service
metadata:
  name: whatchureading
spec:
  selector:
    app: whatchureading
  ports:
    - name: http
      port: 80
      targetPort: http
