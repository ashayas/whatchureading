name: Open Library sync

on:
  schedule:
    # 07:00 UTC on the 11th of every month — a 10-day buffer after Open
    # Library's own monthly dump cadence (around the 1st), so the dump this
    # job fetches is the finished one, not a possibly still-generating one.
    # Runs unattended; no manual trigger needed.
    - cron: "0 7 11 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:openlibrary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENLIBRARY_D1_DATABASE: whatchureading-openlibrary
          OPENLIBRARY_R2_BUCKET: whatchureading-openlibrary-sync
