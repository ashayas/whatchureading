[package]
name = "whatchureading-api"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]
path = "worker/lib.rs"
[dependencies]
worker = { version = "0.8.7", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
